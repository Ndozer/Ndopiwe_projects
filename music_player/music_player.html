<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ndops's music player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e8f5e9; 
        }
        .player-container {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            width: 350px;
            text-align: center;
        }
        .player-title {
            font-size: 1.5rem;
            color: #2e7d32;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }
        .album-art-placeholder {
            width: 100%;
            height: 200px;
            background-color: #f1f8e9;
            border-radius: 12px;
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #558b2f;
            font-size: 0.9rem;
            padding: 10px;
        }
        .track-name { font-weight: bold; margin-bottom: 5px; }
        .artist-name { color: #757575; }
        
        .btn {
            color: #1565c0;
            border: none;
            padding: 12px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            display: inline-block;
            width: 100%;
        }
        #loginBtn { background-color: #a5d6a7; color: #1b5e20; }
        /* Changed selector to match the active element, hidden initially */
        #playButton { background-color: #90caf9; display: none; } 
    </style>
</head>
<body>

    <div class="player-container">
        <h1 class="player-title">Ndops's music player</h1>
        
        <!-- Merged into one cleaner container -->
        <div class="album-art-placeholder">
            <div id="trackName" class="track-name">Status: Disconnected</div>
            <div id="artistName" class="artist-name">Log in with Spotify to begin</div>
        </div>       
        
        <button id="loginBtn" class="btn">Connect Spotify</button>
        <!-- Standardized on id="playButton" -->
        <button id="playButton" class="btn">Play</button>
    </div>
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script src="music_player.js"></script>

</body>
</html>
