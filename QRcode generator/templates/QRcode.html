<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QrCode Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 80vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 24px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px; 
            text-align: left;
        }
        label {
            font-weight: 600;
            color: #34495e;
            font-size: 14px;
            margin-bottom: -5px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px; 
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #3498db; 
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px; 
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9; 
        }
        button:active {
            transform: scale(0.98); 
        }
        .results-box {
            margin-top: 30px;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 500px;
            text-align: left;
        }
        .results-box h2 {
            color: #2c3e50;
            font-size: 18px;
            margin-top: 0;
            border-bottom: 2px solid #f4f7f6;
            padding-bottom: 10px;
        }
        p {
            white-space: pre-wrap;       
            word-wrap: break-word;       
            font-family: monospace;
            max-height: 300px;
            overflow-y: auto;            
            font-size: 13px;
            color: rgb(44, 219, 44);
        }
        .qr-container img {
            max-width: 250px;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Make any QR Code!</h1>
        
        <form action="/submit" method="POST">
            <label for="user_input">Enter information/URL:</label>
            <input type="text" id="user_input" name="text" placeholder="Enter Info/URL..." required>
            <label for="user_input">Enter file path to save your QR Code:</label>
            <input type="text" id="user_input" name="file" placeholder="Enter file path..." required>      
            <button type="submit">Generate</button>
        </form>
    </div>

    {% if results %}
    <div class="results-box">
        <h2>QR Code:</h2>
        <div class="qr-container">
            <img src="data:image/png;base64,{{ results }}" alt="Generated QR Code">
        </div>
        <p>File saved successfully. Check your folder!</p>
    </div>
    {% endif %}

</body>
</html>
