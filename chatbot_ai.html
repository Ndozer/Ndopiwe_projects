<!DOCTYPE html>
<html>
<head>
    <title>Ndopiwe's Chatbot</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 400px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .chat-box {
            height: 450px;
            padding: 10px;
            overflow-y: auto;
            border-bottom: 1px solid #ddd;
        }

        .message {
            margin: 8px 0;
            padding: 8px;
            border-radius: 8px;
            max-width: 80%;
        }

        .user {
            background: #007bff;
            color: white;
            align-self: flex-end;
        }

        .bot {
            background: #e5e5ea;
        }

        .input-area {
            display: flex;
        }

        input {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
            border-radius: 10px;
        }

        button {
            padding: 10px;
            border: none;
            background: #007bff;
            color: white;
            cursor: pointer;
            border-radius: 3px;
        }
    </style>
</head>
<body>
<h2>Welcome to Ndopiwe's ChatBot</h2>
<div class="chat-container">
    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask anything" />
        <button onclick="sendMessage()">Ask</button>
    </div>
</div>

<script src="chatbot_ai.js"></script>
</body>
</html>
