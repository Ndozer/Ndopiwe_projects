<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subtitle Generator</title>
</head>
<body>
    <h1>Subtitle Generator</h1>
    
    <!-- Added enctype so files actually get sent to the server -->
    <form id="form-container" action="/submit" method="POST" enctype="multipart/form-data">
        <!-- Replaced plain button with a functional file input -->
        <input type="file" name="video_file" id="video-input" accept="video/*" required>
        <button type="submit" id="submit-btn">Add Subtitles</button>
    </form>
    <div id="display"></div>
    <div class="response" id="result">
        {% if video_url %}
            <h3>Result:</h3>
            <video width="640" height="360" controls>
                <source src="{{ video_url }}?t={{ range(1, 99999) | random }}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        {% endif %}
    </div>

    <style>
        #display {
            display: none;
            color: red;
            font-weight: bold;
            margin-top: 15px;
        }
        body{
            background-color: aliceblue;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        input[type="file"] {
            padding: 10px;
            background: white;
            border-radius: 8px;
            border: 1px dashed #ccc;
        }
        button{
            width: 320px;
            height: 50px;
            border-radius: 10px;
            border: 0;
            background-color: blue;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover{
            background-color: lightblue;
        }
        button:active {
            transform: scale(0.98);
        }
        video {
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
    </style>
    
    <script>
        const form = document.getElementById('form-container');
        const display = document.getElementById('display');
        const result = document.getElementById('result');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', function() {
            display.style.display = 'block';
            if (result) {
                result.style.display = 'none';
            }
            submitBtn.disabled = true;
            display.innerText = "Processing Video...";
        });
    </script>
</body>
</html>
